# CoMP-MAE-S pretraining — exact hyperparameters of the reported run.
# Transcribed from the launched command line (resolved flags below); matches
# the paper's Appendix A table. Data paths are placeholders.

model: two-stream-v15b        # internal code id; paper name: CoMP-MAE (ViT-S)
comp_mae: true                # symmetric cross-reconstruction branch (v16)

data:
  dataset: egodex
  splits: [part1]             # 4,623,400 train / 324,300 eval frame-pair samples
  frames_root: <EGODEX_FRAMES_ROOT>
  input_range: "[0,1] raw (/255.0); no ImageNet normalization"

optimization:
  epochs: 50
  batch_size_per_gpu: 128     # 8 GPUs -> global batch 1024
  lr: 2.8e-4                  # cosine schedule
  num_workers: 8
  eval_interval: 5

architecture:
  embed_dim: 384              # ViT-S
  num_heads: 6
  depth: 12                   # P stream
  m_depth: 6                  # M stream
  routing_mode: v_from_p      # value-ownership routing (V from P)

objective:
  pair_mode: true             # 2-frame pairs, no compose triple
  no_sobel: true              # P = RGB(3ch), M = |ΔL|(1ch)
  mask_ratio_p: 0.75
  mask_ratio_m_jepa: 0.5
  m_recon_floor: 0.02         # |ΔL|-weighted M-recon floor
  lambda_pred: 1.0
  lambda_m_jepa: 1.0
  lambda_compose: 1.0
  composition_mode: linear_residual
  ema_momentum_init: 0.996
  ema_momentum_final: 0.9999
  lambda_gate_epochs: 0
  rotation_aug: true

sampling:
  max_gap: 30                 # frame-pair temporal gap
  sample_dist: triangular
  sample_center: 15

# Exact CLI as launched (paths redacted):
# python scripts/pretrain.py --model two-stream-v15b --train-data egodex \
#   --egodex-root <EGODEX_FRAMES_ROOT> --egodex-splits part1 --epochs 50 \
#   --batch-size 128 --lr 2.8e-4 --num-workers 8 --depth 12 --v11-m-depth 6 \
#   --v11-routing-mode v_from_p --rotation-aug --mask-ratio-p 0.75 \
#   --max-gap 30 --sample-dist triangular --sample-center 15 \
#   --v15-lambda-pred 1.0 --v15-lambda-m-jepa 1.0 --v15-lambda-compose 1.0 \
#   --v15-mask-ratio-m-jepa 0.5 --v15-composition-mode linear_residual \
#   --v15-ema-momentum-init 0.996 --v15-ema-momentum-final 0.9999 \
#   --v15-lambda-gate-epochs 0 --no-sobel --pair-mode --v15-comp-mae \
#   --v15-m-recon-floor 0.02 --embed-dim 384 --num-heads 6 --eval-interval 5
