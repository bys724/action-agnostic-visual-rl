# CoMP-MAE-S pretraining — exact hyperparameters of the reported run.
# Transcribed from the launched command line (resolved flags below); matches
# the paper's Appendix A table. Data paths are placeholders.

model: comp-mae        # internal code id; paper name: CoMP-MAE (ViT-S)
comp_mae: true                # symmetric cross-reconstruction (M-recon) branch

data:
  dataset: egodex
  splits: [part1]             # 4,623,400 train / 324,300 eval frame-pair samples
  frames_root: <EGODEX_FRAMES_ROOT>
  input_range: "[0,1] raw (/255.0); no ImageNet normalization"

optimization:
  epochs: 50
  batch_size_per_gpu: 128     # 8 GPUs -> global batch 1024
  lr: 2.8e-4                  # cosine schedule
  num_workers: 8
  eval_interval: 5

architecture:
  embed_dim: 384              # ViT-S
  num_heads: 6
  depth: 12                   # P stream
  m_depth: 6                  # M stream
  routing_mode: v_from_p      # value-ownership routing (V from P)

objective:
  pair_mode: true             # 2-frame pairs
  no_sobel: true              # P = RGB(3ch), M = |ΔL|(1ch)
  mask_ratio_p: 0.75
  m_recon_floor: 0.02         # |ΔL|-weighted M-recon loss floor
  lambda_pred: 1.0            # future-prediction P-recon weight
  lambda_m_recon: 1.0         # M-recon (grounding) weight
  rotation_aug: true

sampling:
  max_gap: 30                 # frame-pair temporal gap
  sample_dist: triangular
  sample_center: 15

# Equivalent command with the shipped training script (paths redacted):
# python train/pretrain.py --frames-root <EGODEX_FRAMES_ROOT> --comp-mae \
