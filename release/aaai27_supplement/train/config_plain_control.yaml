# Plain cross-modal MAE-S (matched control) — exact hyperparameters of the
# reported run. Identical to CoMP-MAE-S except the three ablation knobs below
# (same params, same data, same schedule).

model: comp-mae
comp_mae: false               # M-recon OFF (pixel-pred objective instead)

# Differences vs config_comp_mae_s.yaml — everything else identical:
ablation_knobs:
  pixel_pred: true            # replaces symmetric M-recon
  routing_mode: v_from_m      # standard cross-attention (V from M)
  masked_anchor: true         # complete-first anchor, matching CoMP P-recon
  independent_rotation_prob: 0.0

data:
  dataset: egodex
  splits: [part1]
  frames_root: <EGODEX_FRAMES_ROOT>
  input_range: "[0,1] raw (/255.0); no ImageNet normalization"

optimization:
  epochs: 50
  batch_size_per_gpu: 128     # 8 GPUs -> global batch 1024
  lr: 2.8e-4
  num_workers: 8
  eval_interval: 5

architecture:
  embed_dim: 384
  num_heads: 6
  depth: 12
  m_depth: 6

objective:
  pair_mode: true
  no_sobel: true
  mask_ratio_p: 0.75
  lambda_pred: 1.0            # future-prediction P-recon weight
  lambda_recon: 1.0           # in-place P-recon weight
  rotation_aug: true

sampling:
  max_gap: 30
  sample_dist: triangular
  sample_center: 15

# Equivalent command with the shipped training script (paths redacted):
# python train/pretrain.py --frames-root <EGODEX_FRAMES_ROOT> --pixel-pred \
#   --embed-dim 384 --num-heads 6 --depth 12 --m-depth 6 --routing-mode v_from_m \
#   --masked-anchor --epochs 50 --batch-size 128 --lr 2.8e-4 --num-workers 8 \
#   --rotation-aug --independent-rotation-prob 0.0 --mask-ratio-p 0.75 \
#   --max-gap 30 --sample-center 15
